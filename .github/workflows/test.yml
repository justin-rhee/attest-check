name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms even when one fails, so a macOS-only or
      # Linux-only regression is visible in the same run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The suite ends on `[ "$FAIL" -eq 0 ]`, so a failing assertion exits
      # non-zero and fails this step.
      - name: Run the offline suite
        run: bash tests/test-attest-check.sh
